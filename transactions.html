<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e6">
<title>Kumo Café — Transaction History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2f2a;--cream:#fff8f0;--pink:#ffc2d4;--pink2:#ff8fb1;--lav:#d9c8ff;--matcha:#bfe6c4;--yellow:#fff0a8;--h:"Fredoka",system-ui,sans-serif;--b:"Zen Maru Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;color:var(--ink);font:500 16px/1.6 var(--b);background:radial-gradient(circle at 12% 8%,#ffe3ee,transparent 40%),radial-gradient(circle at 90% 20%,#e3ecff,transparent 40%),var(--cream)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--pink2);outline-offset:3px}
.wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}h1,h2,h3{font-family:var(--h);margin:0;line-height:1.05}
header{position:sticky;top:0;z-index:30;background:rgba(255,248,240,.92);backdrop-filter:blur(14px);border-bottom:3px solid var(--ink)}
.nav{display:flex;align-items:center;gap:18px;height:68px}.logo{display:flex;align-items:center;gap:10px;font:700 24px var(--h)}.logo img{width:42px;height:42px;border:2px solid #fff;border-radius:50%;object-fit:cover;box-shadow:2px 2px 0 var(--ink)}.logo small{display:block;margin-top:-4px;font:500 10px var(--b);letter-spacing:2px;color:#9a766b}
nav{display:flex;gap:6px;margin-left:auto}nav a{padding:8px 14px;border-radius:999px;font:600 15px var(--h)}nav a:hover{background:var(--pink)}
.burger{display:none;width:46px;height:46px;margin-left:auto;border:3px solid var(--ink);border-radius:50%;background:#fff;font-size:20px}
.section{padding-block:70px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px}h1{font-size:clamp(38px,6vw,68px)}h1 small{display:block;margin-bottom:8px;font:700 13px var(--b);letter-spacing:3px;color:var(--pink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border:3px solid var(--ink);border-radius:999px;background:var(--pink2);color:#fff;font:600 15px var(--h);box-shadow:3px 3px 0 var(--ink)}.btn.alt{background:#fff;color:var(--ink)}
.table-wrap{overflow:auto;border:3px solid var(--ink);border-radius:24px;background:#fff;box-shadow:6px 6px 0 var(--ink)}table{width:100%;border-collapse:collapse;min-width:760px}thead{background:var(--lav)}th{text-align:left}th,td{padding:16px;border-bottom:2px dashed #e6cfc6}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fff8fb}.order-cell{max-width:340px}.total{font:700 18px var(--h);white-space:nowrap}.date{font-size:13px;color:#7a5b50;white-space:nowrap}
.empty{padding:54px 20px;text-align:center}.empty span{display:block;margin-bottom:10px;font-size:42px}.empty p{margin:0 0 18px}
footer{margin-top:40px;border-top:3px solid var(--ink);background:var(--pink);text-align:center;padding:34px 20px}footer b{font:700 28px var(--h)}footer p{margin:8px 0 0}
@media(max-width:900px){.burger{display:block}nav{position:fixed;top:71px;left:0;right:0;display:flex;flex-direction:column;margin:0;padding:10px 20px 20px;background:var(--cream);border-bottom:3px solid var(--ink);transform:translateY(-130%);transition:.25s}body.open nav{transform:none}nav a{padding:14px 6px;border-bottom:2px dashed #e6cfc6;border-radius:0;font-size:18px}}
@media(max-width:640px){.wrap{width:calc(100% - 28px)}.section{padding-block:48px}.head{align-items:flex-start;flex-direction:column}.logo{font-size:20px}}
</style>
</head>
<body>
<header><div class="wrap nav">
<a class="logo" href="index.html"><img src="images/kumo-cafe-logo.jpg" alt=""><span>Kumo Café<small>くもカフェ</small></span></a>
<nav id="nav"><a href="index.html">Home</a><a href="menu.html#menu">Menu</a><a href="vibes.html#vibes">Mood board</a><a href="story.html#story">Our story</a><a href="visit.html#visit">Visit</a><a href="transactions.html">Transactions</a></nav>
<button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
</div></header>
<main>
<section class="wrap section">
<div class="head"><div><h1><small>取引履歴 · TRANSACTIONS</small>Order history</h1></div><button class="btn alt" id="clearHistory" type="button">Clear history</button></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Gmail</th><th>Order</th><th>Total</th><th>Date</th></tr></thead><tbody id="transactionRows"></tbody></table><div class="empty" id="empty"><span>🧋</span><p>No transactions yet.</p><a class="btn" href="menu.html#menu">Browse the menu</a></div></div>
</section>
</main>
<footer><b>Kumo Café ☁ くもカフェ</b><p>Made with love, sakura and a lot of coffee. © Kumo Café · Demo site</p></footer>
<script>
const rows=document.querySelector("#transactionRows"),empty=document.querySelector("#empty");
const money=n=>"₱"+Number(n).toLocaleString("en-PH");
function render(){
 let history=[];
 try{history=JSON.parse(localStorage.getItem("kumoTransactions")||"[]")}catch(e){history=[]}
 rows.innerHTML=history.map(t=>`<tr><td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.email)}</td><td class="order-cell">${escapeHtml(t.order)}</td><td class="total">${money(t.total)}</td><td class="date">${escapeHtml(t.date)}</td></tr>`).join("");
 empty.style.display=history.length?"none":"block";document.querySelector("table").style.display=history.length?"table":"none";
}
function escapeHtml(value){const span=document.createElement("span");span.textContent=value==null?"":String(value);return span.innerHTML}
document.querySelector("#clearHistory").onclick=()=>{if(confirm("Clear all transaction history?")){localStorage.removeItem("kumoTransactions");render()}};
document.querySelector("#burger").onclick=()=>{const open=document.body.classList.toggle("open");document.querySelector("#burger").setAttribute("aria-expanded",open)};
document.querySelector("#nav").onclick=e=>{if(e.target.closest("a"))document.body.classList.remove("open")};
render();
</script>
</body>
</html>
